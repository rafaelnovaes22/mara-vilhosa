# PORQUÊ: porta fixa igual à variável PORT do serviço e ao target do domínio.
# /health serve o healthcheck Railway sem cair no index.
server {
  listen 8080;
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }
  location / {
    root /usr/share/nginx/html;
    index index.html;
  }
}
